name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, type, tests) + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run --no-sync --no-build --locked ruff check .

      - name: Format
        run: uv run --no-sync --no-build --locked ruff format --check .

      - name: Type check (mypy strict)
        run: uv run --no-sync --no-build --locked mypy src/pyoidc

      - name: Tests + couverture
        run: uv run --no-sync --no-build --locked pytest --cov-report=xml:coverage/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        if: (github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}