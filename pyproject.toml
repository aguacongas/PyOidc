[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pyoidc"
version = "0.1.0"
description = "Serveur OpenID Connect (OIDC) implémentant la spec, bâti sur FastAPI et PyJWT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Olivier Lefebvre", email = "aguacongas@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyjwt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyoidc"]

# ---------------------------------------------------------------------------
# Ruff : lint + format (le standard moderne qui remplace black + flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
fix = true

[tool.ruff.lint]
preview = true
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes (undefined names, unused imports...)
    "I",       # isort (imports triés)
    "N",       # pep8-naming (nommage)
    "UP",      # pyupgrade (syntaxe moderne)
    "B",       # flake8-bugbear (pièges connus)
    "A",       # flake8-builtins (masquage de builtins)
    "C4",      # flake8-comprehensions
    "C90",     # mccabe — complexité cyclomatique (aligné sur SonarCloud S3776, seuil 10)
    "S",       # bandit (sécurité)
    "SIM",     # flake8-simplify (code simplifiable)
    "T",       # flake8-print (interdit print en prod)
    "ANN",     # flake8-annotations (typage explicite obligatoire)
    "PERF",    # pyperf (petites perf non ambiguës)
    "RUF",     # règles spécifiques ruff
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["assert"]  # assert autorisé dans les tests
"scripts/**" = ["print", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]  # script de dev : print + subprocess ok

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# mypy : typage strict
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest + couverture
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-q --cov=pyoidc --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pyoidc"]
branch = true
omit = ["src/pyoidc/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80